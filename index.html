:root[data-theme="dark"]{--bg:#17140f;--card:#25211b;--tx:#f2ede6;--sub:#a89f92;--ac:#ff6b5e;--ln:#38322a;--ac2:#3a211e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC","Hiragino Sans",sans-serif;max-width:560px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:20px;margin:6px 0 12px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.tab{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 2px;font-size:12px;line-height:1.3;text-align:center;cursor:pointer}
.tab b{display:block;font-size:20px;font-weight:400}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#q{width:100%;margin:8px 0;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px}
.item{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:8px 0;font-size:16px;cursor:pointer}
.item:active{background:var(--ac2)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
#sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.zh{color:var(--sub);font-size:15px}
.ja{font-size:30px;font-weight:700;line-height:1.4;margin:12px 0 6px}
.kana{font-size:17px;color:var(--ac);margin-bottom:18px;line-height:1.6}
.row{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px;cursor:pointer}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.note{color:var(--sub);font-size:12px;text-align:center;margin-top:14px}

  Array.prototype.forEach.call(tabs.children,function(t,i){t.classList.toggle("on",i===cur)});
  var k=q.value.trim(),src=[];
  if(k){D.forEach(function(c){c.p.forEach(function(x){if(x[0].indexOf(k)>-1)src.push(x)})})}else{src=D[cur].p}

  src.forEach(function(x){var b=document.createElement("button");b.className="item";b.textContent=x[0];b.onclick=function(){show(x)};list.appendChild(b)});
  if(!src.length){list.innerHTML='<p class="zh">找不到相關會話</p>'}
}
function show(x){
  ja=x[1];
  document.getElementById("szh").textContent=x[0];
  document.getElementById("sja").textContent=x[1];
  document.getElementById("skn").textContent=x[2];
  sheet.classList.add("show");
}

  try{var u=new SpeechSynthesisUtterance(ja);u.lang="ja-JP";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
};
